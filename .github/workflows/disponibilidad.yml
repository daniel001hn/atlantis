name: Actualizar disponibilidad

on:
  schedule:
    # Cada 35 minutos. Era cada 2 horas, pero GitHub arranca los crons con
    # retraso -- medido: 16:30, 14:36, 13:02, 11:00 el 14/08 -- asi que el
    # calendario llegaba a estar 2h40 viejo, y en esa ventana alguien podia
    # ver "disponible" y encontrarse en Airbnb con que ya no habia lugar.
    #
    # Por que 35 y no 15: son 12 consultas a Airbnb por corrida. Cada 15 min
    # eran 1152 al dia; asi son ~500. Airbnb no publica su limite, y si nos
    # bloquea el endpoint .ics se muere el calendario entero -- o sea la
    # funcion principal del sitio. Los gestores de canales consultan cada
    # 30-60 min: quedarse ahi es lo prudente.
    #
    # OJO con la sintaxis: "*/35" dispara en el minuto 0 y en el 35 de cada
    # hora, asi que los huecos alternan 35 y 25 minutos, no 35 fijos. Da un
    # promedio de 30, que es justo lo que buscamos.
    - cron: "*/35 * * * *"
  workflow_dispatch:         # boton para correrlo a mano

permissions:
  contents: write

# Si una corrida se solapa con la anterior, se cancela la vieja.
concurrency:
  group: disponibilidad
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Bajar calendarios de Airbnb
        env:
          # Secret con formato: {"1000767203641214772":"https://...ics?s=...", ...}
          # Settings -> Secrets and variables -> Actions -> New repository secret
          ICS_URLS: ${{ secrets.ICS_URLS }}
        run: node scripts/actualizar-disponibilidad.mjs

      - name: Commitear si cambio algo
        run: |
          if [ -z "$(git status --porcelain disponibilidad.js)" ]; then
            echo "Sin cambios en el calendario."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disponibilidad.js
          git commit -m "Actualizar disponibilidad"

          # Alguien puede haber pusheado mientras corriamos: con dos agentes y
          # William trabajando sobre el mismo repo, pasa seguido. Sin esto el
          # push se rechaza y la corrida entera se pierde, aunque los
          # calendarios ya se hayan bajado bien.
          for intento in 1 2 3; do
            if git push; then
              echo "Pusheado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado (intento $intento). Traigo lo nuevo y rebaseo encima."
            git pull --rebase origin main || exit 1
          done
          echo "No se pudo pushear despues de 3 intentos."
          exit 1
