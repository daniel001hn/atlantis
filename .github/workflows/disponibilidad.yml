name: Actualizar disponibilidad

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas
  workflow_dispatch:         # boton para correrlo a mano

permissions:
  contents: write

# Si una corrida se solapa con la anterior, se cancela la vieja.
concurrency:
  group: disponibilidad
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bajar calendarios de Airbnb
        env:
          # Secret con formato: {"1000767203641214772":"https://...ics?s=...", ...}
          # Settings -> Secrets and variables -> Actions -> New repository secret
          ICS_URLS: ${{ secrets.ICS_URLS }}
        run: node scripts/actualizar-disponibilidad.mjs

      - name: Commitear si cambio algo
        run: |
          if [ -z "$(git status --porcelain disponibilidad.js)" ]; then
            echo "Sin cambios en el calendario."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add disponibilidad.js
          git commit -m "Actualizar disponibilidad"

          # Alguien puede haber pusheado mientras corriamos: con dos agentes y
          # William trabajando sobre el mismo repo, pasa seguido. Sin esto el
          # push se rechaza y la corrida entera se pierde, aunque los
          # calendarios ya se hayan bajado bien.
          for intento in 1 2 3; do
            if git push; then
              echo "Pusheado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado (intento $intento). Traigo lo nuevo y rebaseo encima."
            git pull --rebase origin main || exit 1
          done
          echo "No se pudo pushear despues de 3 intentos."
          exit 1
